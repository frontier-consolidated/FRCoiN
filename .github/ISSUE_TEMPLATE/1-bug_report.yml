name: Bug report
description: Create a bug report for FRCoin
labels: ["bug"]
body:
    - type: textarea
      id: description
      attributes:
          label: Bug description
          description: Give a clear and concise description of what the bug is
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: How to reproduce
          description: A step-by-step guide on how to reproduce the bug
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: Expected behaviour
          description: Give a clear description of what you expect to happen
    - type: markdown
      attributes:
          value: |
              ## How to get your Discord ID

              ### Enable Discord developer mode:
              1. In Discord go to 'User Settings' (the little cog next to your name)
              2. Under 'App Settings' go to the 'Advanced' tab
              3. Enable the 'Developer Mode' option

              ### Copy your Discord ID
              1. Right click your name in the members sidebar or from a message
              2. Click 'Copy User ID'
              3. Paste the id below.
    - type: input
      id: discordid
      attributes:
          label: Discord Id
          description: Your Discord account id (if applicable), will help us find your actions in the bot logs
          placeholder: ex. 255733848162304002
    - type: textarea
      id: context
      attributes:
          label: Additional context
          description: Add any other context or screenshots about the bug report here.
