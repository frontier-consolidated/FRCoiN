name: Security Scan

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    trivy:
        name: Run Trivy
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - uses: actions/checkout@v7

            - name: Cache Trivy database
              uses: actions/cache@v6
              with:
                  path: ~/.cache/trivy/
                  key: trivy-cache-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}

            - name: Setup python
              uses: actions/setup-python@v7.1.0
              with:
                  python-version: "3.14"

            - name: Cache venv
              uses: actions/cache@v6
              id: cache-venv
              with:
                  path: ./.venv/
                  key: ${{ runner.os }}-venv-${{ hashFiles('**/pyproject.toml') }}
                  restore-keys: |
                      ${{ runner.os }}-venv-

            - name: Install dependencies
              run: |
                  python -m venv .venv
                  .venv/bin/pip install .

            - name: Run Trivy vulnerability scanner in fs mode
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  trivy-config: trivy.yaml
