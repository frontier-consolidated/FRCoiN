[project]
name = "frcoin"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg~=0.31.0",
    "discord.py~=2.7.1",
    "python-dotenv~=1.2.2",
    "openpyxl~=3.1.5"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicitly list packages and top-level modules to avoid automatic discovery
# in a flat-layout which rejects multiple top-level packages being discovered.
packages = ["views", "modals"]
# Top-level single-file modules to install (names without .py extension)
py-modules = [
    "actions",
    "audit_logs",
    "db",
    "events",
    "export",
    "helpers",
    "leaderboard",
    "logger",
    "main",
    "panel"
]
