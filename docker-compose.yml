services:
    db:
        image: postgres:17-alpine
        container_name: frcoin-db
        restart: always
        ports:
            - "6767:5432"
        volumes:
            - pg-data:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=frcoin

        healthcheck:
            test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d frcoin'"]
            interval: 10s
            timeout: 3s
            retries: 3

volumes:
    pg-data:
